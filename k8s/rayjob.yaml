apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ${JOB_NAME}
  namespace: ray
  labels:
    app.kubernetes.io/part-of: ray-pipeline
spec:
  entrypoint: python /home/ray/app/app/ray_pipeline.py
  submissionMode: K8sJobMode
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  backoffLimit: 2                  # retry if a Spot node is reclaimed

  rayClusterSpec:
    rayVersion: "2.59.0"

    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
        metrics-export-port: "8080"
      template:
        spec:
          serviceAccountName: ray-sa
          nodeSelector:
            pool: system           # stable on-demand pool
          containers:
            - name: ray-head
              image: ${IMAGE}
              ports:
                - { containerPort: 6379,  name: gcs-server }
                - { containerPort: 8265,  name: dashboard }
                - { containerPort: 10001, name: client }
                - { containerPort: 8080,  name: metrics }
              env:
                - name: DATA_DIR
                  value: gs://ray-platform-data/data
                - name: ICEBERG_WAREHOUSE
                  value: gs://ray-platform-data/warehouse
                - name: PIN_RESOLVER
                  value: "true"
                - name: CATALOG_HOST
                  value: iceberg-catalog.ray.svc.cluster.local
                - name: CATALOG_DB
                  valueFrom:
                    secretKeyRef: { name: iceberg-catalog, key: POSTGRES_DB }
                - name: CATALOG_USER
                  valueFrom:
                    secretKeyRef: { name: iceberg-catalog, key: POSTGRES_USER }
                - name: CATALOG_PASSWORD
                  valueFrom:
                    secretKeyRef: { name: iceberg-catalog, key: POSTGRES_PASSWORD }
              resources:
                requests: { cpu: "1", memory: 4Gi }
                limits:   { cpu: "1", memory: 4Gi }
              volumeMounts:
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 1Gi }

    workerGroupSpecs:
      - groupName: resolver-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          metrics-export-port: "8080"
          resources: '"{\"resolver\": 1}"'     # custom resource the actor asks for
          object-store-memory: "1073741824"    # 1 GiB, backed by the shm volume
        template:
          spec:
            serviceAccountName: ray-sa
            nodeSelector:
              pool: ray-worker                 # Spot pool
            tolerations:
              - key: ray-worker
                operator: Equal
                value: "true"
                effect: NoSchedule
            containers:
              - name: ray-worker
                image: ${IMAGE}
                ports:
                  - { containerPort: 8080, name: metrics }
                env:
                  - name: DATA_DIR
                    value: /home/ray/app/data
                  - name: ICEBERG_WAREHOUSE
                    value: /tmp/warehouse
                  - name: LLM_API_KEY
                    valueFrom:
                      secretKeyRef: { name: llm-api-key, key: LLM_API_KEY }  
                resources:
                  requests: { cpu: "2", memory: 6Gi }
                  limits:   { cpu: "2", memory: 6Gi }
                volumeMounts:
                  - { name: dshm, mountPath: /dev/shm }
            volumes:
              - name: dshm
                emptyDir: { medium: Memory, sizeLimit: 2Gi }